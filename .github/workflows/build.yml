# Continuous integration: compile, test, package and verify on every push to
# master and on every pull request.
#
# One job on purpose. The IntelliJ Platform download (PyCharm 2026.2.3, about a
# gigabyte) is shared by compilation, the searchable-options pass and the
# plugin verifier, so splitting them would pay for it more than once.
name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # PyCharm 2026.2 ships platform classes at class-file major 69, so the
      # compiler needs JDK 25. The emitted bytecode targets 21.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Also validates gradle-wrapper.jar against the published checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # platformLocalPath is emptied so the build downloads the platform named
      # by platformType / platformVersion instead of looking for a local IDE.
      - name: Build and test
        run: ./gradlew build formatJar -PplatformLocalPath= --stacktrace

      - name: Verify plugin
        run: ./gradlew verifyPlugin -PplatformLocalPath= --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          # build/reports also holds the PNGs that PlotChromeTest and
          # WaterfallImageTest render, which is how a layout change is reviewed.
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: warn

      - name: Upload verifier report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: |
            build/distributions/*.zip
            build/libs/csiq-format-*.jar
          if-no-files-found: error
