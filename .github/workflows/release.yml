# Release: a tag v<version> builds, tests and verifies the plugin, then
# publishes a GitHub Release with the installable zip and the standalone
# format jar attached.
#
# The tag must equal pluginVersion in gradle.properties. A mismatch fails the
# run before anything is built, so a release can never carry a zip whose
# descriptor states a different version than its tag.
#
# Nothing is published to the JetBrains Marketplace. Install the zip with
# Settings | Plugins | gear | Install Plugin from Disk.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check tag against pluginVersion
        run: |
          declared="$(sed -n 's/^pluginVersion[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pluginVersion ${declared} in gradle.properties"
            exit 1
          fi
          echo "PLUGIN_VERSION=${declared}" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # A release never writes the shared cache, so it cannot poison the
          # cache that pull requests read.
          cache-read-only: true

      - name: Build and test
        run: ./gradlew build formatJar -PplatformLocalPath= --stacktrace

      - name: Verify plugin
        run: ./gradlew verifyPlugin -PplatformLocalPath= --stacktrace

      - name: Release notes
        # The CHANGELOG.md section for this version, the same text the plugin
        # descriptor carries as its change notes.
        run: ./gradlew getChangelog -PplatformLocalPath= --no-header --no-links --no-empty-sections -q --console=plain > build/RELEASE_NOTES.md

      - name: Checksums
        run: |
          cd build
          sha256sum "distributions/csiq-jetbrains-${PLUGIN_VERSION}.zip" "libs/csiq-format-${PLUGIN_VERSION}.jar" \
            | sed 's#  [a-z]*/#  #' > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a suffix (0.2.0-rc.1) is marked as a pre-release.
          prerelease=""
          case "$PLUGIN_VERSION" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "CSIQ ${PLUGIN_VERSION}" \
            --notes-file build/RELEASE_NOTES.md \
            --verify-tag \
            $prerelease \
            "build/distributions/csiq-jetbrains-${PLUGIN_VERSION}.zip" \
            "build/libs/csiq-format-${PLUGIN_VERSION}.jar" \
            build/SHA256SUMS
