# --- plugin identity -------------------------------------------------------
pluginGroup = io.monadcount.csiq
pluginVersion = 0.1.0

# --- target platform -------------------------------------------------------
# The plugin declares only platform-core dependencies, so it installs into any
# IntelliJ-based IDE. PyCharm is the reference IDE, so the build resolves the
# platform from the locally installed PyCharm by default: an exact match with
# the IDE that will run it, and no multi-gigabyte download.
#
# When that path does not exist, or is set empty (CI passes
# -PplatformLocalPath=), the build downloads platformType / platformVersion
# instead. The pair below is the installed reference IDE exactly (PY-262.10968.92),
# so a local build and a CI build compile against the same classes. PY is the
# product code that installed PyCharm reports in its product-info.json.
platformLocalPath = /Applications/PyCharm.app
platformType = PY
platformVersion = 2026.2.3

# sinceBuild is the branch the plugin was compiled against AND verified on.
# It is not a guess: the plugin verifier has only been run against 262, and a
# lower bound nobody has checked is a compatibility claim with no evidence.
# To widen it, run the verifier against the older branch first:
#   ./gradlew verifyPlugin   with `recommended()` or an explicit older IDE.
#
# untilBuild is left open. The plugin uses stable platform API only, and a hard
# upper bound is what makes a plugin stop working on the next IDE update for no
# reason.
pluginSinceBuild = 262
pluginUntilBuild =

# --- toolchain -------------------------------------------------------------
# PyCharm 2026.2 ships platform classes at class-file major 69 (Java 25), so
# javac and kotlinc must run on a JDK of at least 25. The emitted bytecode
# targets 21, which every supported IDE runtime loads.
javaTarget = 21

# --- gradle ----------------------------------------------------------------
# Where to look for the Java 25 toolchain before downloading one. A JetBrains
# Runtime from an installed IDE is a full JDK and satisfies it. Paths that do
# not exist are ignored.
org.gradle.java.installations.paths = /Applications/PyCharm.app/Contents/jbr/Contents/Home,/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home,/Applications/CLion.app/Contents/jbr/Contents/Home

org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC
org.gradle.caching = true
org.gradle.configuration-cache = false
org.gradle.parallel = true

kotlin.stdlib.default.dependency = false
